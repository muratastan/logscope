function badge(text,type='grey'){return `<span class="badge ${type}">${escapeHtml(text)}</span>`}

function shortTime(d){try{return new Date(d).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'})}catch(e){return String(d)}}
function kpi(title,num,foot,icon,trend=''){return `<div class="kpi"><div class="top"><span>${title}</span>${I(icon)}</div><strong>${num}</strong><span class="foot">${trend?`<b class="trend">${trend}</b> · `:''}${foot}</span></div>`}
function lineChart(points,id='main',withErrors=false,mini=false){if(!points||!points.length)return `<div class="empty">Henüz veri yok</div>`;let w=700,h=mini?128:255,pl=40,pr=14,pt=14,pb=mini?6:32;let minX=pl,maxX=w-pr,base=h-pb;let max=Math.max(100,...points.map(x=>x.requests))*1.19;let toPath=(arr,key,scale=1)=>arr.map((x,i)=>`${i?'L':'M'}${(pl+i*(maxX-pl)/Math.max(arr.length-1,1)).toFixed(2)},${(base-((x[key]||0)/max)*scale*(base-pt)).toFixed(2)}`).join(' ');let primary=toPath(points,'requests');let area=`${primary} L${maxX},${base} L${pl},${base} Z`;let err=toPath(points,'errors',withErrors?6:1);let ticks=[0,.25,.5,.75,1].map(v=>`<line class="grid" x1="${pl}" x2="${maxX}" y1="${base-v*(base-pt)}" y2="${base-v*(base-pt)}"/>${mini?'':`<text x="${pl-7}" y="${base-v*(base-pt)+4}" text-anchor="end">${fmt(max*v)}</text>`}`).join('');let xlabels=mini?'':`<text x="${pl}" y="${h-6}">${shortTime(points[0].ts).split(' ').slice(-1)[0]}</text><text x="${(pl+maxX)/2}" y="${h-6}" text-anchor="middle">Zaman</text><text x="${maxX}" y="${h-6}" text-anchor="end">${shortTime(points[points.length-1].ts).split(' ').slice(-1)[0]}</text>`;return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" role="img" aria-label="Zamana göre sentetik HTTP istek sayısı grafiği"><defs><linearGradient id="fill-${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#30bfa2" stop-opacity=".21"/><stop offset="1" stop-color="#30bfa2" stop-opacity="0"/></linearGradient></defs>${ticks}<path d="${area}" fill="url(#fill-${id})"/><path class="line" d="${primary}"/>${withErrors?`<path class="line2" d="${err}"/>`:''}${xlabels}</svg>`}
function barline(title,amount,max){return `<div class="barline"><span class="mono">${escapeHtml(title)}</span><div class="track"><div class="fill" style="width:${Math.max(1,amount*100/Math.max(max,1)).toFixed(1)}%"></div></div><strong>${fmt(amount)}</strong></div>`}
function alarmRow(a){return `<tr class="clickable" tabindex="0" data-to="/app/alarms/${encodeURIComponent(a.id)}"><td><strong class="mono">${escapeHtml(a.id)}</strong></td><td>${shortTime(a.occurred_at)}</td><td><span class="severity" data-level="${escapeHtml(a.severity)}">${escapeHtml(a.severity)}</span></td><td><strong>${escapeHtml(a.reason)}</strong><div class="tiny muted mono" style="margin-top:5px">${escapeHtml(a.route)}</div></td><td><b>${Math.round(a.score*100)}%</b></td><td>${stateBadge(a.state)}</td><td>${I('chevron','sm')}</td></tr>`}
function alarmTable(rows){return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Alarm ID</th><th>Zaman</th><th>Önem</th><th>Gerekçe / rota</th><th>Skor</th><th>Durum</th><th></th></tr></thead><tbody>${rows.length?rows.map(alarmRow).join(''):`<tr><td colspan="7"><div class="empty">Bu filtreye ait alarm bulunamadı.</div></td></tr>`}</tbody></table></div>`}

let productMemo={};
function getProduct(){try{const a=JSON.parse(localStorage.getItem(PRODUCT_STORE)||'null');if(a&&typeof a==='object'){productMemo=a;return a}}catch(e){}if(!productMemo.teams)productMemo={workspace:'Demo Workspace',environment:'Test',timeZone:'Europe/Istanbul',wizardStep:1,setupDone:false,teams:[{name:'Elif Feyza Ünal',email:'elif@demo.local',role:'Yönetici',status:'Demo'},{name:'Murat Astan',email:'murat@demo.local',role:'Analist',status:'Demo'}],notifications:[],notificationFilter:'Tümü',connected:{},prefs:{critical:true,ingest:true,system:true}};return productMemo}
function putProduct(d){productMemo=d;try{localStorage.setItem(PRODUCT_STORE,JSON.stringify(d))}catch(e){}}
const pubHeader=()=>`<header class="public-top">${brand()}<nav><a href="#/">Ana sayfa</a><a href="#/pricing">Paketler</a><a href="#/login">Giriş</a><a href="#/register" class="btn primary small" style="color:white">Üye ol</a></nav></header>`;

function resetPassword(){return pubPage(`<div class="form-panel"><span class="badge gold">${I('lock','sm')} Hesap güvenliği</span><h1 style="margin-top:20px">Şifrenizi mi unuttunuz?</h1><p>Bu ekran, planlanan parola kurtarma akışının ürün tasarımıdır.</p><form id="reset-form"><label for="reset-email" class="field-label">E-posta adresi</label><input id="reset-email" class="input" type="email" required placeholder="isim@kurum.com"><button type="submit" class="btn primary full" style="margin-top:26px">Sıfırlama isteğini simüle et</button></form><div class="mini-note" id="reset-feedback" style="display:none"></div><form id="reset-confirm-form" style="display:none"><label class="field-label">Yerel test kodu</label><input id="reset-token" class="input" required/><label class="field-label">Yeni parola</label><input id="reset-new-pass" type="password" minlength="8" class="input" required/><button class="btn primary full" type="submit">Şifreyi güncelle</button></form><div class="thin-note warn" style="margin-top:23px">Gerçek e-posta gönderimi etkin değildir. Herhangi bir hesap şifresi bu ekranda değiştirilmez.</div><div style="text-align:center;margin-top:23px"><button data-to="/login" class="btn light">${I('arrowleft','sm')} Girişe dön</button></div></div>`)}
function pricing(){const packages=[{name:'Demo',badge:'Kullanıma açık',price:'Ücretsiz prototip',desc:'İşleyişi sentetik trafik ve hazır alarmlarla değerlendirin.',features:['Temel trafik analizi','Model mimarisi ve demo sinyaller','Alarm inceleme ve notlar','Örnek JSONL yükleme','CSV raporu'],cta:'Demoyu başlat',act:'quick-demo',hl:false},{name:'Ekip',badge:'Planlanan paket',price:'Teklif üzerine',desc:'Birden fazla analistin birlikte çalışabileceği tasarım.',features:['Ekip üyeleri ve roller','Entegrasyon yönetim ekranı','Bildirim merkezi tasarımı','Gelişmiş raporlama planı','Özelleştirilebilir görünüm'],cta:'Demo kaydı oluştur',act:'register',hl:true},{name:'Kurumsal',badge:'Konsept',price:'Özel teklif',desc:'Üretim kullanımı için tasarlanan ileri seviye yetenekler.',features:['Genişletilebilir API','Çoklu çalışma alanı','Kurumsal rol ve denetim altyapısı','Saklama politikası yönetimi','Özel entegrasyon kapsamı'],cta:'Özellikleri incele',act:'features',hl:false}];return pubPage(`<div class="public-lead"><span class="mini-eyebrow">ÜRÜN PAKETLERİ</span><h1>Ölçeklenebilir analiz için sade paketler</h1><p>Ürün geliştirme aşamasındadır. Ticari fiyatlar henüz belirlenmemiştir ve bu sayfa gerçek ödeme toplamaz.</p></div><div class="price-grid">${packages.map(p=>`<article class="price-card ${p.hl?'featured':''}"><span class="badge ${p.hl?'teal':'grey'}" style="align-self:start">${p.badge}</span><h2 style="margin-top:21px">${p.name}</h2><p>${p.desc}</p><div class="pricing-price">${p.price}</div><ul class="price-list">${p.features.map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn ${p.hl?'primary':'dark'} full" ${p.act==='quick-demo'?'data-action="quick-demo"':p.act==='register'?'data-to="/register"':'data-to="/app/models"'}>${p.cta} ${I('arrow','sm')}</button></article>`).join('')}</div><div class="thin-note" style="margin-top:27px;text-align:center">Fiyatlandırma, sözleşme, vergi ve ödeme altyapısı henüz bulunmuyor. Bu paketler ürün sunumu için örneklendirilmiştir.</div>`)}
function wizard(){const d=getProduct(),steps=['Çalışma alanı','Veri kaynağı','Gizlilik','İlk analiz'],step=Math.min(Math.max(Number(d.wizardStep)||1,1),4);let body='';if(step===1)body=`<div class="saas-field"><label for="w-name">Çalışma alanı adı</label><input id="w-name" maxlength="60" value="${escapeHtml(d.workspace||'Demo Workspace')}"></div><div class="saas-field"><label for="w-env">Ortam</label><select id="w-env">${['Test','Geliştirme','Demo'].map(x=>`<option ${d.environment===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="saas-field"><label for="w-tz">Saat dilimi</label><select id="w-tz"><option>Europe/Istanbul</option><option>UTC</option></select></div>`;if(step===2)body=`<h3>Veri sözleşmesini seçin</h3><div class="thin-note">HTTP istekleri için JSONL biçimi kullanılır. Kaynak gerçek bir sisteme bağlanmadan önce anonimleştirme filtresinden geçmelidir.</div><div class="saas-field"><label for="w-source">Veri kaynağı</label><select id="w-source"><option>Django / JSONL dosyası</option><option>Locust sentetik testleri</option><option>REST API (planlanan)</option></select></div><button class="btn light" data-to="/app/sources">${I('upload','sm')} Veri kaynaklarını aç</button>`;if(step===3)body=`<h3>Gizlilik ilkeleri</h3>${['Ham IP, çerez ve token alanlarının saklanmaması','Parola veya istek gövdesinin alınmaması','Rota şablonu ve anonim oturum referansı kullanımı','Hatalı kayıtların ayrı raporlanması'].map(x=>`<div class="checkline"><span>✓</span>${x}</div>`).join('')}<div class="thin-note warn">Bu demo, gerçek kurumsal güvenlik kontrolü veya uyumluluk sertifikasyonu sağlamaz.</div>`;if(step===4)body=`<h3>İlk analiz deneyine hazırsınız</h3><div class="checkline"><span>✓</span> Çalışma alanı: ${escapeHtml(d.workspace||'Demo Workspace')}</div><div class="checkline"><span>✓</span> Veri kaynağı: Örnek JSONL</div><div class="checkline"><span>✓</span> Gizlilik filtresi: Etkin demo doğrulaması</div><p class="muted small">M1–M4 gerçek eğitimi henüz uygulanmadı; göstergeler sentetik veriden oluşur.</p>`;return shell('onboarding',`${head('İlk kurulum','Çalışma alanını yapılandırmak için dört adımlı rehber.',`<button class="btn" data-to="/app/integrations">${I('code','sm')} Entegrasyonlara geç</button>`)}<div class="flow-steps">${steps.map((x,i)=>`<div class="flow-step ${i+1===step?'active':i+1<step?'done':''}"><b>${i+1<10?'0':''}${i+1}</b>${x}</div>`).join('')}</div><div class="two-col"><section class="app-card"><div class="section-head"><div><h2>Adım ${step} / 4 — ${steps[step-1]}</h2><small>Demo yapılandırması · veriler tarayıcıya kaydedilir</small></div>${badge(step===4?'Son adım':'Kurulum sürüyor','gold')}</div>${body}<div style="display:flex;justify-content:space-between;gap:12px;margin-top:30px"><button class="btn" data-action="wizard-back" ${step===1?'disabled':''}>${I('arrowleft','sm')} Önceki</button><button class="btn primary" data-action="wizard-next">${step===4?'Paneli aç':'Sonraki adım'} ${I('arrow','sm')}</button></div></section><aside class="wizard-side"><h3>Başlamadan önce</h3>${['Uygulama trafiğini tanımlayın','Gizlilik filtresini yapılandırın','Veri formatını doğrulayın','Analiz paneline geçin'].map(x=>`<div class="checkline"><span>✓</span>${x}</div>`).join('')}<div class="thin-note">Kurulum adımları bir ürün akışını temsil eder; gerçek hesap ve entegrasyon oluşturulmaz.</div></aside></div>`)}

function saveFile(blob,name,type='application/octet-stream'){let b=new Blob([blob],{type});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

async function downloadSample(){if(!state.offline){location.href='/api/sample.jsonl';return}let e={event_uid:'sample-001',occurred_at:'2026-10-28T14:00:00Z',http_method:'GET',route_template:'/catalog/',status_code:200,duration_ms:136.5,session_ref:'synthetic-s1',schema_version:'1.0'};saveFile(JSON.stringify(e)+'\n'+JSON.stringify({...e,event_uid:'sample-002',route_template:'/items/{id}/'})+'\n','logscope_ornek.jsonl','application/x-ndjson');toast('Örnek JSONL indirildi.')}
const fields=new Set(['event_uid','occurred_at','http_method','route_template','status_code','duration_ms','session_ref','schema_version']);
async function ingestFile(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.jsonl'))throw Error('Yalnız .jsonl yüklenebilir');if(file.size>1024*1024)throw Error('Dosya en fazla 1 MB olabilir');if(!state.offline){let fd=new FormData();fd.append('file',file);let data=await api('/ingest',{method:'POST',body:fd});toast(`${data.accepted} kayıt alındı, ${data.rejected} kayıt reddedildi.`);return}let text=await file.text();let d=getOffline(),accepted=0,rejected=0;let lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length>2000)throw Error('En fazla 2000 satır');for(let line of lines){let o;try{o=JSON.parse(line)}catch(e){rejected++;continue}if(!o||typeof o!=='object'||Array.isArray(o)||Object.keys(o).some(k=>!fields.has(k))||typeof o.event_uid!=='string'||!(/^[A-Za-z0-9._-]{1,96}$/).test(o.event_uid)||!(/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d/).test(o.occurred_at||'')||!['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'].includes(o.http_method)||typeof o.route_template!=='string'||!(/^\/[A-Za-z0-9_\/{}/-]{0,150}$/).test(o.route_template)||!Number.isInteger(o.status_code)||o.status_code<100||o.status_code>599||typeof o.duration_ms!=='number'||o.duration_ms<0||o.duration_ms>1e7||(o.session_ref!==undefined&&!(/^[A-Za-z0-9_-]{1,80}$/).test(o.session_ref))||d.events.some(e=>e.uid===o.event_uid)){rejected++;continue}d.events.push({uid:o.event_uid,occurred_at:o.occurred_at,method:o.http_method,route:o.route_template,status:o.status_code,duration_ms:o.duration_ms});accepted++}d.batches.push({filename:file.name,accepted,rejected,created_at:new Date().toISOString()});saveOffline(d);toast(`${accepted} kayıt alındı, ${rejected} kayıt reddedildi.`)}

r.');return true}if(a.startsWith('integr-config:')){let type=a.split(':')[1];if(type==='Dosya'){location.hash='#/app/sources';return true}const area=$('#integr-detail');if(area){area.scrollIntoView({behavior:'smooth'});toast(type+' entegrasyonunun teknik sözleşmesi gösteriliyor. Canlı servis bağlanmadı.')}return true}if(a==='copy-schema'){const val=JSON.stringify({event_uid:'demo-1001',occurred_at:'2026-10-28T14:00:00Z',http_method:'GET',route_template:'/catalog/',status_code:200,duration_ms:136.5,session_ref:'synthetic-s1',schema_version:'1.0'},null,2);try{await navigator.clipboard.writeText(val);toast('JSONL şeması kopyalandı.')}catch(e){toast('Tarayıcı kopyalamaya izin vermedi. Şemayı seçip kopyalayabilirsin.')}return true}return false;}

async function doAction(action){
 if(action==='run-ingested'){
  if(state.offline){toast('Log analizi için FastAPI sunucusu gerekir.');return}
  const b=$('[data-action="run-ingested"]');if(b){b.disabled=true;b.textContent='Loglar analiz ediliyor...'}
  try{const v=await api('/ingested/analyze',{method:'POST'});state.uploadedAnalysis=v.result;toast('Yüklenen loglarda '+v.result.total_alerts+' keşifsel uyarı bulundu.');await render();}
  catch(err){toast('Log analizi: '+err.message);if(b){b.disabled=false;b.textContent='Yüklenen logları analiz et'}}return;
 }
 if(action==='run-experiment'){
  if(state.offline){toast('Sentetik makine öğrenmesi deneyi için FastAPI sunucusu gerekir.');return;}
  const b=$('[data-action="run-experiment"]');if(b){b.disabled=true;b.textContent='Eğitim ve test çalışıyor...';}
  try{const result=await api('/experiments/run',{method:'POST',body:JSON.stringify({windows:1200,requests_per_window:100,seed:42})});
      toast('Sentetik deney hesaplandı: '+fmt(result.result.data.total_http_requests)+' simüle istek.');await render();}
  catch(err){toast('Deney başarısız: '+err.message);if(b){b.disabled=false;b.textContent='Deneyi başlat';}}return;
 }
 if(action==='mark-all-read'&&!state.offline){try{await api('/notifications/read-all',{method:'POST'})}catch(err){toast(err.message)}}
 if(action==='wizard-next'&&!state.offline){
  const d=getProduct();try{await api('/onboarding',{method:'PUT',body:JSON.stringify({step:Math.min(4,(d.wizardStep||1)),workspace_name:($('#w-name')?.value||d.workspace||'Demo Workspace'),source_type:'jsonl',privacy_checked:true})});}
  catch(err){toast('Kurulum API kaydı başarısız: '+err.message);}
 }
 if(action.startsWith('integr-config:')&&!state.offline){
  const raw=action.split(':')[1];const map={'Django':'django','API':'rest_api','Locust':'locust','PostgreSQL':'postgresql','Dosya':'jsonl','Webhook':'webhook'};
  const provider=map[raw]||'jsonl';try{await api('/integrations',{method:'POST',body:JSON.stringify({provider,name:raw,status:'configured'})});toast(raw+' entegrasyon taslağı kaydedildi.');}catch(err){toast(err.message)}
 }
 if(await productAction(action))return;if(action==='quick-demo')return quickDemo();if(action==='download')return downloadCsv();if(action==='sample')return downloadSample();if(action==='print')return window.print();if(action==='docs'){if(state.offline)toast('API dokümantasyonu sunucu ile çalışır: /api/docs');else window.open('/api/docs','_blank','noopener');return}if(action==='logout'){try{await api('/logout',{method:'POST'})}catch(e){}state.authenticated=false;state.user=null;location.hash='#/';return}if(action==='reset'){if(!confirm('Alarm incelemeleri ve yüklenen JSONL kayıtları silinerek demo sıfırlansın mı?'))return;await api('/reset',{method:'POST'});toast('Demo başlangıç durumuna alındı.');return render()}if(action==='choose-file'){$('#file-input')?.click();return}if(action==='search-alarms'){state.alarmQuery=$('#alarm-search')?.value.trim()||'';return render()}if(action==='clear-filters'){state.alarmQuery='';state.alarmFilter='Tümü';state.severityFilter='Tümü';return render()}}
async function render(){let route=decodeURIComponent(location.hash.replace(/^#/,''))||'/';if(route==='/'){document.title='LogScope — Açıklanabilir log analizi';$('#app').innerHTML=landing();return}if(route==='/login'){document.title='LogScope · Giriş';$('#app').innerHTML=login();return}if(route==='/register'||route==='/reset-password'||route==='/pricing'){document.title='LogScope · '+(route==='/register'?'Kayıt ol':route==='/pricing'?'Paketler':'Şifre sıfırlama');$('#app').innerHTML=route==='/register'?registration():route==='/pricing'?pricing():resetPassword();return}if(route.startsWith('/app/')&&!state.authenticated){location.hash='#/login';return}$('#app').innerHTML=`<div class="app-shell"><div class="sidebar"></div><main class="app-main" style="padding:65px"><div class="skeleton"></div></main></div>`;try{let parts=route.split('/'),page=parts[2]||'overview';let content=page==='overview'?await dashboard():page==='traffic'?await traffic():page==='models'?await models():page==='alarms'?(parts[3]?await detail(parts[3]):await alarms()):page==='sources'?await sources():page==='reports'?await reports():page==='settings'?await settings():page==='onboarding'?wizard():page==='integrations'?integrations():page==='team'?team():page==='notifications'?notifications():page==='help'?help():page==='billing'?billing():await dashboard();$('#app').innerHTML=content;document.title='LogScope · '+(pageNames[page]||'Alarm detayı');window.scrollTo({top:0,behavior:'instant'})}catch(e){$('#app').innerHTML=`<div class="empty" style="min-height:60vh"><h2>İçerik yüklenemedi</h2><p>${escapeHtml(e.message)}</p><button class="btn" data-to="/app/overview">Genel bakışa dön</button></div>`;toast(e.message)}}
